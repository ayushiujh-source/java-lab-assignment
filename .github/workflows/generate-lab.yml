name: Generate and Validate Java Lab Assignments
on:
  push:
    paths:
      - ".github/workflows/generate-lab.yml"
      - "tools/generate_lab.py"
      - "tools/create_lab_pdf.py"
  pull_request:
    paths:
      - ".github/workflows/generate-lab.yml"
      - "tools/generate_lab.py"
      - "tools/create_lab_pdf.py"
permissions:
  contents: write
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow reportlab
      - name: Generate Assignments 2-15 and source/output panels
        run: python tools/generate_lab.py
      - name: Build personalized lab PDF and code-view panels
        run: python tools/create_lab_pdf.py
      - name: Compile and run every Java question
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            temp_dir="$(mktemp -d)"
            cp "$file" "$temp_dir/Main.java"
            javac -encoding UTF-8 -d "$temp_dir" "$temp_dir/Main.java"
            java -cp "$temp_dir" Main >/dev/null
            rm -rf "$temp_dir"
            echo "PASS: $file"
            count=$((count + 1))
          done < <(find Assignment* -type f -name Main.java -print0 | sort -z)
          echo "Validated $count Java programs."
      - name: Commit generated assignments and lab PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assignment1 Assignment2 Assignment3 Assignment4 Assignment5 Assignment6 Assignment7 Assignment8 Assignment9 Assignment10 Assignment11 Assignment12 Assignment13 Assignment14 Assignment15 Java_Lab_File_Ayushi.pdf
          git commit -m "Generate complete Java lab assignment file" || echo "No changes to commit"
          git push
